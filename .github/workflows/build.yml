name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 shellcheck

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints-ci.txt

      - name: Lint
        run: |
          ruff check src tests tools install/lib
          shellcheck -S warning install/*.sh scripts/*.sh

      - name: Tests
        run: pytest -q

      # The committed templates must be exactly what the current source
      # produces. If a spec changes and nobody re-ran `just all`, the
      # repository is shipping artwork that no longer matches its own
      # documentation, and this step says so.
      - name: Rebuild from source and verify
        run: |
          python -m rmtpl build --clean
          python -m rmtpl docs
          python -m rmtpl bundle
          python tools/contact_sheet.py templates docs/images
          python -m rmtpl doctor

      # `git diff` cannot see a file that was never added, so a new family or
      # variant whose artwork was forgotten would slip through. `git status`
      # sees both. docs/images is excluded deliberately: the contact sheet
      # renders its labels with Pillow's bundled bitmap font, which changes
      # across releases, and its bytes carry no information anyone relies on.
      - name: Committed output is up to date
        run: |
          DRIFT=$(git status --porcelain -- templates docs ':!docs/images')
          if [ -n "$DRIFT" ]; then
            echo "::error::templates/ or docs/ are stale. Run 'just all' and commit."
            echo "$DRIFT"
            git --no-pager diff -- templates docs ':!docs/images' | head -100
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: templates
          path: templates/
