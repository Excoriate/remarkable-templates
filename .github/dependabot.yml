version: 2
updates:
  # The workflow pins actions by major tag; this keeps those current and is the
  # only supply chain this repository has at build time.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
